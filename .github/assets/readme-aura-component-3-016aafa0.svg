<svg width="278" height="60" viewBox="0 0 278 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="1" y="1" width="276" height="58" rx="12" fill="#0a0b10"/>
  <rect x="1" y="1" width="276" height="58" rx="12" fill="rgba(219,48,105,0.12)" stroke="rgba(219,48,105,0.3)" stroke-width="2"/>

  <!-- Instagram logo -->
  <g transform="translate(78 16)">
