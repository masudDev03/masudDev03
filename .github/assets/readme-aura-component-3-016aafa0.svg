    <rect x="6" y="6" width="16" height="16" rx="5" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="14" cy="14" r="3.8" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="18.6" cy="9.4" r="1.2" fill="#fff"/>
  </g>

  <!-- name -->
  <text x="118" y="37" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#fda4af">Instagram</text>
</svg>
